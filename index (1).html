<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Happy Valentine 💖</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 350px;
        }

        h1 {
            color: #ff4d6d;
        }

        p {
            font-size: 18px;
            color: #444;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: #ff4d6d;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e63950;
        }

        .heart {
            font-size: 40px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="heart">❤️</div>
    <h1>Happy Valentine’s Day</h1>
    <p id="message">เค้ามีอะไรจะบอกเธอ...</p>
    <button onclick="surprise()">กดดูเซอร์ไพรส์ 💌</button>
</div>

<script>
    function surprise() {
        document.getElementById("message").innerHTML =
            "ขอบคุณที่เข้้ามาเป็นความสุขในทุกวันของเค้าน้า 💖<br>คบกับเค้าไหม";
    }
</script>

</body>
</html>
